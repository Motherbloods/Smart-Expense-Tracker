client_body_temp_path /tmp/client_body;
proxy_temp_path        /tmp/proxy;
fastcgi_temp_path      /tmp/fastcgi;
uwsgi_temp_path        /tmp/uwsgi;
scgi_temp_path         /tmp/scgi;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript text/xml application/xml image/svg+xml application/manifest+json;

    include /etc/nginx/security-headers.inc;

    error_page 404 /index.html;

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    location = /login {
        try_files /login/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    location = /privasi {
        try_files /privasi/index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    location ~ ^/(login|privasi)/$ {
        return 301 /$1;
    }

    location ~ ^/(laporan|aktivitas-pengguna|admin-laporan)$ {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/security-headers.inc;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.inc;
    }

    location ~ ^/(sw\.js|registerSW\.js|manifest\.webmanifest|workbox-[A-Za-z0-9_-]+\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.inc;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.inc;
    }

    location / {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/security-headers.inc;
    }
}
